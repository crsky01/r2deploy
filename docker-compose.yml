services:
  # ===== 数据库 =====
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ===== 数据库初始化（建表 + 权限，只跑一次） =====
  db-init:
    image: postgres:15-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./init:/init:ro
    command: >
      sh -c "psql -h db -U postgres -d postgres
      -v auth_password='${AUTHENTICATOR_PASSWORD}'
      -f /init/01-schema.sql"

  # ===== 数据 API（PostgREST） =====
  postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: authenticator
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    expose:
      - "3000"

  # ===== 网站（Next.js） =====
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgrest:
        condition: service_started
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_SUPABASE_URL: http://caddy:8080
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET}
    expose:
      - "3000"

  # ===== z2ios 数据 API =====
  z2-postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/z2ios
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: authenticator
      PGRST_JWT_SECRET: ${Z2_JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    expose:
      - "3000"

  # ===== z2ios 网站 =====
  z2-app:
    build:
      context: ../../z2ios
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      z2-postgrest:
        condition: service_started
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_SUPABASE_URL: http://caddy:8081
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${Z2_ANON_KEY}
      ADMIN_PASSWORD: ${Z2_ADMIN_PASSWORD}
      ADMIN_TOTP_SECRET: ${Z2_ADMIN_TOTP_SECRET}
    expose:
      - "3000"

  # ===== k2ios 数据 API =====
  k2-postgrest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD}@db:5432/k2ios
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: authenticator
      PGRST_JWT_SECRET: ${K2_JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
    expose:
      - "3000"

  # ===== k2ios 网站 =====
  k2-app:
    build:
      context: ../../k2ios
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      k2-postgrest:
        condition: service_started
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_SUPABASE_URL: http://caddy:8082
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${K2_ANON_KEY}
      ADMIN_PASSWORD: ${K2_ADMIN_PASSWORD}
      ADMIN_TOTP_SECRET: ${K2_ADMIN_TOTP_SECRET}
    expose:
      - "3000"

  # ===== 反向代理 + 自动 HTTPS =====
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - z2-app
      - k2-app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  db_data:
  caddy_data:
  caddy_config:
